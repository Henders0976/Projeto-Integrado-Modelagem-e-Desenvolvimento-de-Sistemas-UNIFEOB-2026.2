name: CI

# Roda em todo PR e em todo push na main. Nada aqui usa chave real: o MySQL é descartável, criado só para o teste,
# e o JWT_SECRET abaixo vale apenas dentro deste job.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Site (tipos, testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build # inclui o tsc --noEmit

  api:
    name: API (testes e migração, com MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: api
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: Rv_Label
      JWT_SECRET: segredo-so-para-o-teste-do-ci-com-mais-de-32-caracteres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - name: Cria o banco com o schema.sql
        run: mysql -h 127.0.0.1 -uroot -proot < schema.sql
      - run: npm run migrar
      - run: npm run test:migrar
      - name: Sobe a API e roda o teste de ponta a ponta
        run: |
          node server.js &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/saude && break; sleep 1; done
          npm test

  app:
    name: App Flutter (análise e testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android:
    name: App Android (build do APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Sem android/key.properties sai assinado com a chave de debug: o job só confere que o Gradle e o pacote compilam.
      - run: flutter build apk --release
